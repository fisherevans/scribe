# Example shape of the `scribe-r2` secret the deployment patch reads. Do NOT
# commit real values - these come from the `nottingham-cloud` Bitwarden item
# (fields r2-endpoint, r2-access-key-id, r2-secret-access-key, r2-bucket-name,
# r2-public-url), the same five the !upload bot uses.
#
# Create it directly from BW rather than from this file, e.g.:
#   kubectl -n scribe create secret generic scribe-r2 \
#     --from-literal=R2_ENDPOINT="$(scripts/bw-field.sh nottingham-cloud r2-endpoint)" \
#     --from-literal=R2_ACCESS_KEY_ID="$(scripts/bw-field.sh nottingham-cloud r2-access-key-id)" \
#     --from-literal=R2_SECRET_ACCESS_KEY="$(scripts/bw-field.sh nottingham-cloud r2-secret-access-key)" \
#     --from-literal=R2_BUCKET="$(scripts/bw-field.sh nottingham-cloud r2-bucket-name)" \
#     --from-literal=R2_PUBLIC_URL="$(scripts/bw-field.sh nottingham-cloud r2-public-url)"
#
# R2_PUBLIC_URL may be a bare domain (media.fisher.sh); upload-r2.sh prepends a
# scheme if missing.
apiVersion: v1
kind: Secret
metadata:
  name: scribe-r2
  namespace: scribe
type: Opaque
stringData:
  R2_ENDPOINT: https://<account-id>.r2.cloudflarestorage.com
  R2_ACCESS_KEY_ID: <r2-s3-access-key>
  R2_SECRET_ACCESS_KEY: <r2-s3-secret>
  R2_BUCKET: media-fisher-sh
  R2_PUBLIC_URL: media.fisher.sh
