# Example strategic-merge patch for the scribe Deployment, enabling R2 uploads.
# Copy the relevant bits into your deploy infra (e.g. a kustomize overlay over
# deploy/k3s). Two changes: run the R2-enabled image (built from ./Dockerfile),
# and feed the upload command its R2 credentials from a secret.
#
# SCRIBE_UPLOAD_CMD is baked into the overlay image's ENV, so it isn't repeated
# here. The five R2_* values come from the `scribe-r2` secret (see
# secret.example.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scribe
  namespace: scribe
spec:
  template:
    spec:
      containers:
        - name: scribe
          image: ghcr.io/fisherevans/scribe-r2:v0.1.2 # built from ./Dockerfile
          env:
            - name: R2_ENDPOINT
              valueFrom: { secretKeyRef: { name: scribe-r2, key: R2_ENDPOINT } }
            - name: R2_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: scribe-r2, key: R2_ACCESS_KEY_ID } }
            - name: R2_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: scribe-r2, key: R2_SECRET_ACCESS_KEY } }
            - name: R2_BUCKET
              valueFrom: { secretKeyRef: { name: scribe-r2, key: R2_BUCKET } }
            - name: R2_PUBLIC_URL
              valueFrom: { secretKeyRef: { name: scribe-r2, key: R2_PUBLIC_URL } }
