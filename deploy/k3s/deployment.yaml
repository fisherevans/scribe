apiVersion: apps/v1
kind: Deployment
metadata:
  name: scribe
  namespace: scribe
spec:
  replicas: 1
  # Single writer: scribe owns one git working tree + a notes file on the shared
  # volume. Two pods would corrupt them, so the old pod fully terminates before
  # the new one starts (brief downtime per deploy is fine).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scribe
  template:
    metadata:
      labels:
        app: scribe
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: scribe
          image: ghcr.io/fisherevans/scribe:v0.1.8
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SCRIBE_ADDR
              value: ':8080'
            - name: SCRIBE_REPO
              value: /data/repo
            - name: SCRIBE_DATA
              value: /data/scribe
            # The blog repo scribe clones, edits, and pushes to.
            - name: SCRIBE_BLOG_REPO
              value: fisherevans/log
            - name: SCRIBE_MAIN_BRANCH
              value: main
            - name: SCRIBE_STAGING_BRANCH
              value: staging
            - name: SCRIBE_PUSH
              value: '1'
            # Identity on commits scribe makes to the blog.
            - name: GIT_AUTHOR_NAME
              value: Fisher Evans
            - name: GIT_AUTHOR_EMAIL
              value: fisher@fisherevans.com
            # GitHub token used to clone + push the blog repo (HTTPS credential).
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scribe-secrets
                  key: GIT_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scribe-data
