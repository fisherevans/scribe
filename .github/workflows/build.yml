name: build image

# Builds and publishes the scribe container image to GHCR, matching the
# nottingham-cloud convention (rsvp's workflow):
#   push to main  -> :main, :sha-<short>, :latest
#   tag vX.Y.Z    -> :vX.Y.Z, :sha-<short>
# Deploys pin an explicit vX.Y.Z tag; cut a release by pushing a git tag.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
  # Weekly rebuild of the default branch on a fresh base (nottingham-cloud#800).
  # Publishes only the rolling tags (:main/:latest/:sha-*); a version tag
  # is never rebuilt, so a pinned deploy cannot move. See
  # nottingham-cloud agent/app-contract.md.
  schedule:
    - cron: '7 9 * * 6'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scribe
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Scheduled and manual rebuilds skip the layer cache and re-pull the
          # base, or a cached `apk add`/`apt-get install` layer keeps the stale package.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
